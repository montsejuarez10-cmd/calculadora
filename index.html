<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taller de Patrones</title>
<meta name="description" content="Cinco herramientas de cálculo para el proceso de patronaje.">
<link rel="stylesheet" href="css/styles.css">
<!-- Las fuentes (data URI, ~139 KB) se cargan aparte para no bloquear el primer pintado. -->
<link rel="stylesheet" href="css/fonts.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="css/fonts.css"></noscript>
</head>
<body>

<svg class="mat-illustrations" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <g id="piece-bodice">
      <path class="piece piece-outline" d="M15,20 C15,8 35,2 50,10 C65,2 85,8 85,20 L95,55 L85,130 L60,140 L40,140 L15,130 L5,55 Z"/>
      <path class="piece piece-detail" d="M50,58 L45,96 M50,58 L55,96"/>
      <path class="piece piece-solid" d="M50,20 L50,110 M44,20 L44,26 M56,20 L56,26 M44,104 L56,104 M44,110 L56,110"/>
      <polygon class="notch" points="5,55 11,53 11,58"/>
      <polygon class="notch" points="95,55 89,53 89,58"/>
    </g>

    <g id="piece-sleeve">
      <path class="piece piece-outline" d="M10,40 C10,15 40,5 60,5 C80,5 95,15 95,40 L85,45 L80,120 L25,120 L20,45 Z"/>
      <path class="piece piece-solid" d="M55,18 L55,108 M49,18 L61,18 M49,108 L61,108"/>
      <polygon class="notch" points="10,40 16,39 15,44"/>
      <polygon class="notch" points="95,40 89,39 90,44"/>
    </g>

    <g id="piece-skirt">
      <path class="piece piece-outline" d="M35,10 C45,2 65,2 75,10 L95,130 L15,130 Z"/>
      <path class="piece piece-solid" d="M55,24 L55,112 M49,24 L61,24 M49,112 L61,112"/>
      <path class="piece piece-detail" d="M35,10 L15,130 M75,10 L95,130"/>
    </g>

    <g id="piece-pants">
      <path class="piece piece-outline" d="M20,5 L80,5 L88,20 L78,140 L55,140 L50,70 L45,140 L22,140 L12,20 Z"/>
      <path class="piece piece-solid" d="M35,22 L35,60 M29,22 L41,22"/>
      <polygon class="notch" points="12,20 18,20 15,25"/>
      <polygon class="notch" points="88,20 82,20 85,25"/>
    </g>

    <g id="piece-collar">
      <path class="piece piece-outline" d="M10,60 C10,25 35,10 60,10 C85,10 100,25 100,60 L92,60 C92,32 78,20 60,20 C42,20 18,32 18,60 Z"/>
      <circle class="notch" cx="60" cy="66" r="1.6"/>
      <circle class="notch" cx="40" cy="63" r="1.6"/>
      <circle class="notch" cx="80" cy="63" r="1.6"/>
    </g>
  </defs>

  <g opacity="0.22"><use href="#piece-bodice" transform="translate(90,60) rotate(-8) scale(1.3)"/></g>
  <g opacity="0.16"><use href="#piece-sleeve" transform="translate(1180,40) rotate(12) scale(1.15)"/></g>
  <g opacity="0.18"><use href="#piece-skirt" transform="translate(1250,420) rotate(-6) scale(1.4)"/></g>
  <g opacity="0.15"><use href="#piece-pants" transform="translate(60,520) rotate(7) scale(1.2)"/></g>
  <g opacity="0.20"><use href="#piece-collar" transform="translate(640,40) rotate(3) scale(1.1)"/></g>
  <g opacity="0.13"><use href="#piece-bodice" transform="translate(1120,650) rotate(15) scale(0.9)"/></g>
  <g opacity="0.14"><use href="#piece-sleeve" transform="translate(-20,300) rotate(-20) scale(1)"/></g>
  <g opacity="0.12"><use href="#piece-pants" transform="translate(760,700) rotate(-10) scale(1.05)"/></g>
  <g opacity="0.16"><use href="#piece-skirt" transform="translate(340,720) rotate(9) scale(0.85)"/></g>
</svg>

<!-- El desfile: segunda capa de fondo, encima del tapiz y por debajo del
     contenido. Se ancla al pie de la ventana, asi que cae bajo los botones. El
     degradado de mascara disuelve el tapiz dentro de la escena en vez de
     cortarlo con una linea recta. -->
<img class="pasarela" src="img/pasarela.svg" alt="" aria-hidden="true">

<main>
  <p class="eyebrow">Taller de patronaje</p>
  <h1>De tus medidas al <em>patrón perfecto</em></h1>
  <p class="lede">Cinco herramientas de cálculo pensadas para el proceso de patronaje. Elige una opción para desplegar su calculadora.</p>

  <div class="options" id="options">
    <button type="button" class="tag-btn" data-opcion="1">
      <!-- Corta y con vuelo: la cintura estrecha, el bajo abierto al triple y
           curvado como cae la tela. Las dos tablas salen de la cintura y se
           abren con ella; paran antes del bajo para que su trazo no se funda
           con el contorno al tamaño del botón. -->
      <span class="tag-num"><svg class="tag-icon" viewBox="0 0 126 108" aria-hidden="true"><path d="M46,12 C54,4 72,4 80,12 L116,90 C98,100 28,100 10,90 Z"/><path d="M57,16 L46,86 M69,16 L80,86"/></svg></span>
      <span>
        <span class="tag-label">Falda</span>
        <span class="tag-sub">Base</span>
      </span>
    </button>
    <button type="button" class="tag-btn" data-opcion="2">
      <!-- Corpiño sin mangas: el escote, los picos de hombro y las sisas son lo
           que lo distingue de un contorno cualquiera al tamaño del botón. -->
      <span class="tag-num"><svg class="tag-icon" viewBox="0 0 100 145" aria-hidden="true"><path d="M8,32 L34,13 C40,25 60,25 66,13 L92,32 C84,46 80,58 80,72 C80,92 70,110 68,130 L32,130 C30,110 20,92 20,72 C20,58 16,46 8,32 Z"/></svg></span>
      <span>
        <span class="tag-label">Cuerpo</span>
        <span class="tag-sub">Base</span>
      </span>
    </button>
    <button type="button" class="tag-btn" data-opcion="3">
      <!-- Solo el canesú: escote, hombros y las dos mangas, cortado por debajo
           de las sisas. Sin cuerpo no hay nada que confundir con el corpiño
           de al lado, y lo que queda son justo las mangas.
           La caja es más ancha que alta para que quepa el vuelo: las dos mangas
           bajan en campana, con el canto exterior curvado hacia fuera, y el puño
           acaba midiendo casi cuatro veces el ancho del hombro. -->
      <span class="tag-num"><svg class="tag-icon" viewBox="0 0 160 116" aria-hidden="true"><path d="M62,8 C70,26 90,26 98,8 L116,20 C136,46 152,72 158,104 L106,110 C104,84 102,60 102,46 C88,51 72,51 58,46 C58,60 56,84 54,110 L2,104 C8,72 24,46 44,20 Z"/></svg></span>
      <span>
        <span class="tag-label">Manga</span>
        <span class="tag-sub">Base</span>
      </span>
    </button>
    <button type="button" class="tag-btn" data-opcion="4">
      <span class="tag-num"><svg class="tag-icon" viewBox="0 0 100 145" aria-hidden="true"><path d="M20,5 L80,5 L88,20 L78,140 L55,140 L50,70 L45,140 L22,140 L12,20 Z"/></svg></span>
      <span>
        <span class="tag-label">Pantalón</span>
        <span class="tag-sub">Base</span>
      </span>
    </button>
    <button type="button" class="tag-btn" data-opcion="5">
      <!-- La falda pañuelo entera vista en plano: un cuadrado girado 45 grados,
           cuyas cuatro esquinas son los picos que cuelgan, con el círculo de la
           cintura en el centro. Es el dibujo de "Ayuda a la confección" de la
           lámina. -->
      <span class="tag-num"><svg class="tag-icon" viewBox="0 0 120 120" aria-hidden="true"><path d="M60,8 L112,60 L60,112 L8,60 Z"/><circle cx="60" cy="60" r="17"/></svg></span>
      <span>
        <span class="tag-label">Pañuelo</span>
        <span class="tag-sub">Falda</span>
      </span>
    </button>
  </div>

</main>

<dialog id="opcion-modal" aria-labelledby="modal-titulo" aria-describedby="modal-desc">
  <div class="card">
    <button type="button" class="card-close" id="modal-cerrar" aria-label="Cerrar">&times;</button>
    <!-- El icono va en su propio span porque el título se escribe con
         textContent y borraría cualquier hijo que hubiese dentro. -->
    <h2 id="modal-titulo"><span class="titulo-icono" id="modal-icono" aria-hidden="true"></span><span id="modal-titulo-texto"></span></h2>
    <p id="modal-desc">Contenido pendiente: aquí se añadirán las instrucciones y el detalle definitivo de esta herramienta.</p>

    <div class="iframe-wrap" id="iframe-wrap">
      <p class="iframe-loading" id="iframe-loading">Cargando herramienta…</p>
      <iframe id="modal-iframe" scrolling="no"></iframe>
    </div>
  </div>
</dialog>

<script src="js/app.js" defer></script>

</body>
</html>
